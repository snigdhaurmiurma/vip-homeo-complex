<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(10, 8)" filter="url(#glow)">
    <!-- Outer Golden Ring / Shield -->
    <path d="M 42 2 C 65 2, 80 16, 80 38 C 80 62, 55 78, 42 84 C 29 78, 4 62, 4 38 C 4 16, 19 2, 42 2 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    
    <!-- Medical Cross with Organic Curves -->
    <path d="M 37 20 L 47 20 A 2 2 0 0 1 49 22 L 49 33 L 60 33 A 2 2 0 0 1 62 35 L 62 45 A 2 2 0 0 1 60 47 L 49 47 L 49 58 A 2 2 0 0 1 47 60 L 37 60 A 2 2 0 0 1 35 58 L 35 47 L 24 47 A 2 2 0 0 1 22 45 L 22 35 A 2 2 0 0 1 24 33 L 35 33 L 35 22 A 2 2 0 0 1 37 20 Z" fill="#ffffff" opacity="0.95" />
    
    <!-- Homeopathic Healing Leaf in center -->
    <path d="M 42 26 C 42 26, 52 34, 49 46 C 46 54, 42 56, 42 56 C 42 56, 38 54, 35 46 C 32 34, 42 26, 42 26 Z" fill="url(#goldGrad)" />
    <path d="M 42 28 L 42 54" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />

    <!-- VIP Crown/Stars above or inside -->
    <circle cx="28" cy="14" r="2" fill="url(#goldGrad)" />
    <circle cx="42" cy="10" r="2.8" fill="url(#goldGrad)" />
    <circle cx="56" cy="14" r="2" fill="url(#goldGrad)" />
  </g>

  <!-- Typography -->
  <!-- VIP Badge -->
  <g transform="translate(108, 14)">
    <rect x="0" y="0" width="46" height="20" rx="5" fill="url(#goldGrad)" />
    <text x="23" y="14" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1.5">VIP</text>

    <!-- Main Title: HOMEO COMPLEX -->
    <text x="54" y="16" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" letter-spacing="0.5">HOMEO COMPLEX</text>
    
    <!-- Bangla Subtitle -->
    <text x="2" y="42" fill="#047857" font-family="'Hind Siliguri', sans-serif" font-weight="700" font-size="17" letter-spacing="0.2">ভিআইপি হোমিও কমপ্লেক্স</text>

    <!-- Tagline -->
    <text x="2" y="62" fill="#64748b" font-family="'Hind Siliguri', sans-serif" font-weight="500" font-size="11.5">আধুনিক ও ক্লাসিক্যাল হোমিওপ্যাথি চিকিৎসাসেবা কেন্দ্র</text>
  </g>
</svg>
